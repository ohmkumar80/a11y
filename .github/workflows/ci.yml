name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint, migrations, isolation + auth tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-dev-only
          POSTGRES_DB: a11y
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      PGPASSWORD: postgres-dev-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: cp .env.example .env
      - name: Create DB roles (same script docker-compose uses)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          set -a; . ./.env; set +a
          POSTGRES_USER=postgres POSTGRES_DB=a11y PGHOST=localhost sh infra/postgres/01-roles.sh
      - run: pip install -e "libs/core[dev]" -e "workers/web_audit[dev]" -e "apps/api[dev]"
      # The scanner tests drive real Chromium with the pinned engine bundles.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @a11y/engine-bundles...
      - name: Engine bundles are built from the pinned versions and the rule catalogue matches them
        run: pnpm --filter @a11y/engine-bundles build
      - run: python -m playwright install --with-deps chromium
      - run: ruff check libs apps/api workers && ruff format --check libs apps/api workers
      - name: Migrations apply, roll back and re-apply; models match migrations
        working-directory: apps/api
        run: |
          set -a; . ../../.env; set +a
          alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - name: Tests (includes cross-tenant isolation suite, a blocking gate)
        working-directory: apps/api
        run: pytest -q

  web:
    name: Web (lint, types, unit + axe, tokens, Storybook, e2e axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint          # eslint-plugin-jsx-a11y strict
      - run: pnpm -r typecheck     # TypeScript strict
      - name: Design-token contrast (light + dark)
        run: pnpm --filter @a11y/ui check:contrast
      - name: Component tests (vitest-axe + keyboard interaction)
        run: pnpm --filter @a11y/ui test
      - name: Storybook builds
        run: pnpm --filter @a11y/ui build-storybook
      - run: pnpm --filter @a11y/web exec playwright install --with-deps chromium
      - name: E2E - axe on every route, role and colour scheme
        run: pnpm --filter @a11y/web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: apps/web/playwright-report }

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/api.Dockerfile -t a11y-api .
      - run: docker build -f infra/web.Dockerfile -t a11y-web .
      - run: docker build -f infra/web-worker.Dockerfile -t a11y-web-worker .

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
