[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "a11y-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "a11y-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "email-validator>=2.2",
  "aiosmtplib>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "httpx>=0.28", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["a11y_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608"]
"alembic/*" = ["E501", "S608"]
# Fixtures imported from another test module are re-used as parameters (pytest idiom).
"tests/test_reports_api.py" = ["F811"]
# scans.py builds WHERE clauses from a fixed allow-list of column names; every VALUE is a bound
# parameter (tests/test_scans_api.py sends hostile filter input to prove it).
"a11y_api/routers/scans.py" = ["S608"]
