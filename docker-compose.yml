# One command: `make up` (or `docker compose up --build`). Migrations and seed data run automatically.
name: a11y

x-api-env: &api-env
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB:-a11y}
  A11Y_OWNER_PASSWORD: ${A11Y_OWNER_PASSWORD}
  A11Y_APP_PASSWORD: ${A11Y_APP_PASSWORD}
  A11Y_ADMIN_PASSWORD: ${A11Y_ADMIN_PASSWORD}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET}
  ENV: ${ENV:-development}
  MFA_SUPER_ADMIN_DEFAULT: ${MFA_SUPER_ADMIN_DEFAULT:-required}
  MFA_ORG_ADMIN_DEFAULT: ${MFA_ORG_ADMIN_DEFAULT:-optional}
  A11Y_MASTER_KEYS: ${A11Y_MASTER_KEYS:-Q2OoEdjRtijEf6Bd8VUo4q6_2oBKlFXaQopiFpf0lgc=}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8010}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  S3_ENDPOINT_URL: http://s3:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-a11y-dev}
  CLAMD_HOST: clamav
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MAIL_FROM: ${MAIL_FROM:-no-reply@a11y.local}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-a11y}
      A11Y_OWNER_PASSWORD: ${A11Y_OWNER_PASSWORD}
      A11Y_APP_PASSWORD: ${A11Y_APP_PASSWORD}
      A11Y_ADMIN_PASSWORD: ${A11Y_ADMIN_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-a11y}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for local development. MinIO no longer publishes pullable images,
  # so we use RustFS. Production uses real S3 / Azure Blob behind the storage interface (ADR 0002).
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    volumes: [s3data:/data]
    ports: ["${S3_PORT:-9000}:9000", "${S3_CONSOLE_PORT:-9001}:9001"]

  s3-init:
    image: amazon/aws-cli:latest
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-a11y-dev}
    volumes: [./infra/s3-init.sh:/s3-init.sh:ro]
    entrypoint: ["/bin/sh", "/s3-init.sh"]
    restart: "no"

  # Virus scanner for uploaded documents (ADR 0020). Files are held back until it passes them, and stay held if
  # it is down, so the API and workers never depend on it being up. The first start downloads the signature
  # database, which takes a few minutes. Signatures live in a volume so later starts are quick.
  clamav:
    image: clamav/clamav-debian:stable  # multi-arch (the plain clamav/clamav image has no arm64 build)
    volumes: [clamdata:/var/lib/clamav]
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  migrate:
    build: { context: ., dockerfile: infra/api.Dockerfile }
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    command: sh -c "cd /app/apps/api && alembic upgrade head && python -m a11y_api.seed"
    restart: "no"

  api:
    build: { context: ., dockerfile: infra/api.Dockerfile }
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports: ["${API_PORT:-8000}:8000"]
    command: uvicorn a11y_api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: { context: ., dockerfile: infra/api.Dockerfile }
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    command: celery -A a11y_core.celery_app worker -Q system,media,ai --loglevel=INFO

  # Browser worker: scans customer-supplied URLs. All browser traffic goes through an egress proxy that
  # refuses private/internal addresses (ADR 0007). In production this service must ALSO run in a
  # network segment with no route to internal services; the proxy is defence in depth, not the only control.
  web-worker:
    build: { context: ., dockerfile: infra/web-worker.Dockerfile }
    environment: *api-env
    init: true
    ipc: host
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Documents worker: renders reports and runs the PDF/UA (veraPDF) and DOCX accessibility gates.
  docs-worker:
    build: { context: ., dockerfile: infra/docs-worker.Dockerfile }
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Exactly one scheduler (hourly trial expiry). Never scale this service above 1.
  beat:
    build: { context: ., dockerfile: infra/api.Dockerfile }
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    command: celery -A a11y_core.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule

  web:
    build: { context: ., dockerfile: infra/web.Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    ports: ["${WEB_PORT:-3000}:3000"]

volumes:
  pgdata:
  s3data:
  clamdata:
