<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Accessible example page</title></head>
<body>
<a href="#main">Skip to main content</a>
<header><nav aria-label="Main"><a href="/about.html">About us</a></nav></header>
<main id="main">
  <h1>Accessible example</h1>
  <p style="color:#222;background:#fff">Readable text with strong contrast.</p>
  <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="A single transparent pixel used as a test image">
  <form>
    <label for="email">Email address</label>
    <input id="email" type="email" autocomplete="email">
    <button type="submit">Subscribe</button>
  </form>
  <h2>Details</h2>
  <ul><li>One</li><li>Two</li></ul>
</main>
<footer><p>Footer</p></footer>
</body>
</html>
