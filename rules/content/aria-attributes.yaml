id: aria-attributes
status: draft
summary: ARIA attributes must be real, allowed on that element, and have valid values.
why: Invalid ARIA is ignored or makes a control announce the wrong state.
who:
- Screen reader users
steps:
- Remove misspelled or unsupported aria-* attributes.
- Use only values the attribute allows (true, false, mixed...).
- Use native HTML where you can.
examples:
- stack: html
  before: <div aria-foo="bar">Text</div>
  after: <div>Text</div>
links:
- title: 4.1.2 Name, Role, Value
  url: https://www.w3.org/WAI/WCAG22/Understanding/name-role-value.html
test: Run an ARIA validator.
