id: heading-order
status: draft
summary: Heading levels should not skip (h1, then h2, then h3).
why: People who navigate by headings rely on levels to understand the page outline.
who:
- Screen reader users
steps:
- Use heading levels to show structure, not for size.
- Do not skip a level.
examples:
- stack: html
  before: <h1>Title</h1><h4>Part</h4>
  after: <h1>Title</h1><h2>Part</h2>
links:
- title: 1.3.1 Info and Relationships
  url: https://www.w3.org/WAI/WCAG22/Understanding/info-and-relationships.html
test: List headings with a screen reader.
