id: nested-interactive
status: draft
summary: Interactive controls must not contain other interactive controls.
why: Nested controls (a button inside a button) are not announced reliably and are hard to operate.
who:
- Screen reader and keyboard users
steps:
- Separate the controls so none contains another.
- Use one control for one action.
examples:
- stack: html
  before: <div role="button" tabindex="0"><button>Inner</button></div>
  after: <button>Inner</button>
links:
- title: 4.1.2 Name, Role, Value
  url: https://www.w3.org/WAI/WCAG22/Understanding/name-role-value.html
test: Tab through; each stop should be one control.
