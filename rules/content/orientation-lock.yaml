id: orientation-lock
status: draft
summary: Content must work in both portrait and landscape.
why: Some people mount a device in one fixed orientation, for example on a wheelchair.
who:
- People using a fixed-orientation device
- People with motor impairments
steps:
- Remove CSS or scripts that lock the orientation.
examples:
- stack: html
  before: '<style>@media (orientation: landscape){html{transform:rotate(-90deg)}}</style>'
  after: <style>/* no orientation lock */</style>
links:
- title: 1.3.4 Orientation
  url: https://www.w3.org/WAI/WCAG22/Understanding/orientation.html
test: Rotate the device.
machine_check: false
manual_reason: Orientation locks are set by scripts and cannot be detected statically.
