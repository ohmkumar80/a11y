id: progress-meter-name
status: draft
summary: Progress bars and meters need an accessible name that says what they measure.
why: A progress bar that only announces "30 percent" does not tell people what is 30 percent complete.
who:
- Screen reader users
- Voice control users
steps:
- Add aria-label, or point aria-labelledby at visible text, saying what the bar measures, such as "Upload progress".
- Keep the value up to date as it changes.
examples:
- stack: html
  before: <div role="progressbar" aria-valuenow="3" aria-valuemin="0" aria-valuemax="10"></div>
  after: <div role="progressbar" aria-valuenow="3" aria-valuemin="0" aria-valuemax="10" aria-label="Upload progress"></div>
links:
- title: 1.1.1 Non-text Content
  url: https://www.w3.org/WAI/WCAG22/Understanding/non-text-content.html
test: Move to the control with a screen reader; it should say what it measures.
