id: use-of-color
status: draft
summary: Do not use colour as the only way to show something, such as a link inside text.
why: People with colour-vision deficiency may not see the difference.
who:
- People with colour-vision deficiency
- People with low vision
steps:
- Underline links in text, or add another cue such as an icon or bold.
- Make sure the cue itself has enough contrast.
examples:
- stack: html
  before: <p>Read our <a href="/p" style="text-decoration:none">policy</a>.</p>
  after: <p>Read our <a href="/p" style="text-decoration:underline">policy</a>.</p>
links:
- title: 1.4.1 Use of Color
  url: https://www.w3.org/WAI/WCAG22/Understanding/use-of-color.html
test: View the page in greyscale.
