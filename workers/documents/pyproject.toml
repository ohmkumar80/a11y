[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "a11y-documents"
version = "0.1.0"
description = "Accessible document generation (PDF/UA) and validation"
requires-python = ">=3.11"
dependencies = ["a11y-core", "weasyprint==70.0", "pikepdf>=9", "jinja2>=3.1", "python-docx>=1.1", "defusedxml>=0.7", "pydantic>=2.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["a11y_documents*"]

[tool.setuptools.package-data]
a11y_documents = ["templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
# The veraPDF runner executes a fixed command line on a temp file we just wrote (no untrusted input in
# the argv); the temp dir is made world-readable only so the container user can read the PDF.
"a11y_documents/verapdf.py" = ["S603", "S607", "S103"]
